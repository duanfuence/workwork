name: Deploy check

# Проверка скриптов выкладки и восстановления на настоящем SSH-сервере внутри раннера (D-035): rsync и SFTP,
# резервные копии, сбой копии и каждого этапа, аварийное завершение rsync на сервере, обрыв связи,
# восстановление, вход по паролю. На хостинг ничего не выкладывает,
# секретов не использует. Запускается только при изменении файлов выкладки.
on:
  push:
    branches: ['**']
    paths:
      - scripts/deploy*.sh
      - scripts/restore.sh
      - scripts/check-site.sh
      - public/.htaccess
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-check.yml
      - .github/workflows/restore.yml
  pull_request:
    paths:
      - scripts/deploy*.sh
      - scripts/restore.sh
      - scripts/check-site.sh
      - public/.htaccess
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-check.yml
      - .github/workflows/restore.yml

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

concurrency:
  group: deploy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Выкладка и восстановление на тестовом SSH-сервере
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Инструменты
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q openssh-server rsync lftp sshpass shellcheck strace >/dev/null
      - name: shellcheck
        run: shellcheck -x scripts/*.sh
      - run: npm ci
      # С адресом: без него сборка без sitemap.xml, и скрипт выкладки (верно) откажется её выкладывать.
      # example.com — зарезервированный тестовый домен.
      - run: npm run build
        env:
          SITE_URL: https://example.com
      - name: Сценарии на тестовом сервере
        run: sudo DEPLOY_E2E=1 bash scripts/deploy-e2e.sh
