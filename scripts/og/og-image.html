<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>ДомРасчёт — изображение для соцсетей</title>
    <!--
      Шаблон Open Graph-изображения 1200 × 630 в стиле «Чертёж» (DES-1): сетка, чернила, размерные линии.
      Цвета — дизайн-токены сайта, шрифты — файлы сайта из public/fonts, логотип — как в шапке.
      Картинка пересоздаётся командой npm run og:image (scripts/og-image.mjs) → public/og.png.
    -->
    <link rel="stylesheet" href="../../src/styles/tokens.css" />
    <style>
      /* Шрифты сайта по относительному пути: шаблон открывается из файла, а не с сервера. */
      @font-face {
        font-family: 'Onest';
        font-weight: 800;
        src: url('../../public/fonts/onest-cyrillic-800-normal.woff2') format('woff2');
        unicode-range: U+0400-045F;
      }
      @font-face {
        font-family: 'Onest';
        font-weight: 800;
        src: url('../../public/fonts/onest-latin-800-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+2000-206F;
      }
      @font-face {
        font-family: 'Onest';
        font-weight: 400;
        src: url('../../public/fonts/onest-cyrillic-400-normal.woff2') format('woff2');
        unicode-range: U+0400-045F;
      }
      @font-face {
        font-family: 'Onest';
        font-weight: 400;
        src: url('../../public/fonts/onest-latin-400-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+2000-206F;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 500;
        src: url('../../public/fonts/jetbrains-mono-cyrillic-500-normal.woff2') format('woff2');
        unicode-range: U+0400-045F;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 500;
        src: url('../../public/fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+2000-206F;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
      }

      body {
        display: grid;
        grid-template-rows: 1fr auto;
        background-color: var(--color-bg);
        background-image:
          linear-gradient(var(--color-grid-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--color-grid-line) 1px, transparent 1px);
        background-size: 24px 24px;
        color: var(--color-text);
        font-family: 'Onest', sans-serif;
        overflow: hidden;
      }

      main {
        display: grid;
        grid-template-columns: 1fr 380px;
        align-items: center;
        gap: 56px;
        padding: 64px 80px 40px;
      }

      .stamp {
        display: inline-block;
        padding: 6px 12px;
        border: 2px solid var(--color-text);
        background: var(--color-surface);
        font-family: 'JetBrains Mono', monospace;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 24px;
        margin-top: 32px;
      }

      .brand__mark {
        flex: none;
        width: 104px;
        height: 104px;
      }

      .brand__name {
        font-size: 92px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .tagline {
        margin-top: 32px;
        color: var(--color-text-secondary);
        font-size: 44px;
        font-weight: 400;
        line-height: 1.2;
      }

      .plan {
        width: 380px;
        height: 330px;
      }

      .plan__room {
        fill: var(--color-surface);
        stroke: var(--color-text);
        stroke-width: 6;
      }

      .plan__dim {
        stroke: var(--color-dimension);
        stroke-width: 2;
      }

      .plan__label {
        fill: var(--color-dimension-text);
        font-family: 'JetBrains Mono', monospace;
        font-size: 22px;
        font-weight: 500;
      }

      .plan__note {
        fill: var(--color-text);
        font-family: 'JetBrains Mono', monospace;
        font-size: 22px;
        font-weight: 500;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 88px;
        padding: 0 80px;
        background: var(--color-primary);
        color: var(--color-on-primary);
        font-family: 'JetBrains Mono', monospace;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <p class="stamp">Лист 00 · калькуляторы ремонта</p>
        <div class="brand">
          <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect
              x="1"
              y="1"
              width="30"
              height="30"
              rx="2"
              fill="var(--color-surface)"
              stroke="var(--color-accent)"
              stroke-width="2"
            ></rect>
            <path
              d="M12 23H8V9h16v14h-6"
              fill="none"
              stroke="var(--color-text)"
              stroke-width="2"
            ></path>
            <path
              d="M12 23v-6a6 6 0 0 1 6 6"
              fill="none"
              stroke="var(--color-dimension)"
              stroke-width="2"
            ></path>
          </svg>
          <p class="brand__name">ДомРасчёт</p>
        </div>
        <p class="tagline">Сколько материалов купить — и из чего складывается каждая цифра</p>
      </div>
      <!-- План комнаты с размерными линиями: 4,00 × 3,00 м, высота стен 2,70 м. -->
      <svg class="plan" viewBox="0 0 380 330" aria-hidden="true">
        <rect class="plan__room" x="70" y="20" width="290" height="240"></rect>
        <path class="plan__dim" d="M70 290h290M70 280v20M360 280v20"></path>
        <text class="plan__label" x="215" y="322" text-anchor="middle">4,00 м</text>
        <path class="plan__dim" d="M44 20v240M34 20h20M34 260h20"></path>
        <text
          class="plan__label"
          x="0"
          y="0"
          transform="translate(28 140) rotate(-90)"
          text-anchor="middle"
        >
          3,00 м
        </text>
        <text class="plan__note" x="215" y="132" text-anchor="middle">h = 2,70 м</text>
        <text class="plan__note" x="215" y="166" text-anchor="middle">S стен = 37,8 м²</text>
      </svg>
    </main>
    <div class="footer">
      <span>Бесплатно · без регистрации · с формулами</span>
      <span>Спецификация к покупке</span>
    </div>
  </body>
</html>
